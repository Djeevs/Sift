# Copy this file to wrangler.toml after creating a separate KV namespace and D1
# database for the reader. Never reuse another reader's bindings.
name = "sift-reader-name"
main = "src/index.ts"
preview_urls = false
workers_dev = true
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "SIFT_FEEDS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[d1_databases]]
binding = "SIFT_DB"
database_name = "sift-reader-name-events"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[observability]
enabled = true
