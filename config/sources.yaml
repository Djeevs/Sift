# ---------------------------------------------------------------------------
# sources.yaml
#
# A source is not a single weight. Each one carries:
#
#   quality_prior      How likely an item from here deserves deeper inspection.
#                      Dominates before Luna; deliberately fades after Terra has
#                      actually read the article (see final-ranking.yaml).
#   volume_budget      How much attention this source may *request*. A busy feed
#                      gets a smaller budget so it cannot crowd the funnel.
#   exploration_floor  A floor that keeps new or rarely-surfaced sources from
#                      disappearing permanently.
#   category_priors    Quality differs by topic: 404 Media on internet culture is
#                      not 404 Media on physics. Unlisted categories fall back to
#                      `default`.
#   feed_weights       How welcome this source is in each generated feed.
#   hard_rules         Deterministic per-source drops (stage 2). Never relevance.
#
# Learned statistics live in the database (source_statistics) and never overwrite
# these values -- both are combined at scoring time.
# ---------------------------------------------------------------------------

defaults:
  feed_type: article
  language: en
  enabled: true
  access: free
  item_kind: article
  quality_prior: 0.55
  volume_budget: 1.0
  exploration_floor: 0.08
  category_priors:
    default: 0.45
  feed_weights:
    default: 0.60

sources:

