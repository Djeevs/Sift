# ---------------------------------------------------------------------------
# models.yaml
#
# Stage 4 (Luna) and stage 5 (Terra). Model ids never appear in code.
#
# reasoning_effort is passed through verbatim and is a free-form string, so a new
# provider value works by editing this file. When it is set, `temperature` is not
# sent: reasoning models generally reject it.
#
# The system prompt is identical for every item in a stage and sits at the front
# of each request, so the provider serves it from its prompt cache. That only
# works above a minimum prompt length -- measured hit rate is ~92%. If
# `cache_hit` in `npm run stats` falls to 0%, the prompt has dropped below the
# provider's floor.
# ---------------------------------------------------------------------------

version: 1

models:
  # Stage 4 --- "Does this plausibly deserve human attention?"
  triage:
    model: gpt-5.6-luna
    reasoning_effort: none
    max_output_tokens: 220
    max_concurrency: 6
    # developers.openai.com/api/docs/pricing, checked 2026-08-19.
    cost_per_1m_input: 0.20
    cost_per_1m_cached_input: 0.02
    cost_per_1m_output: 1.20

  # Stage 5 --- "Does this genuinely deserve human attention?"
  deep:
    model: gpt-5.6-terra
    reasoning_effort: low
    # 1000, not 700: reasoning tokens count against this ceiling, and the sync
    # path was overriding the old 700 in code precisely because it truncated.
    # The override is gone, so this is the only place the limit is set.
    max_output_tokens: 1000
    max_concurrency: 4
    cost_per_1m_input: 2.00
    cost_per_1m_cached_input: 0.20
    cost_per_1m_output: 12.00
    # Batch API where the queue is large enough: cheaper, and latency does not
    # matter for a reading system.
    mode: auto
    batch_min_items: 25
    batch_poll_interval_seconds: 60
    # The provider's deadline for completing the batch. Distinct from how long
    # a run waits for it, which is batch_collect_wait_seconds below.
    batch_max_wait_hours: 24
    # The provider's batch discount, used to price batch usage in the ledger.
    # Recording batch at the sync rate made month-to-date spend read ~2x high,
    # which is what the degradation ladder and the per-run allowance are
    # computed from -- so the pipeline throttled itself on a number that was
    # wrong. Check this against the provider's pricing page when it changes.
    batch_discount: 0.5
    # How long a run may wait for a batch before leaving it to the next run.
    # 0 means submit and move on. Waiting inline once froze publishing, the
    # scheduler and ingestion together for as long as the provider took.
    batch_collect_wait_seconds: 90

  # Stage 3 semantic scoring. See `semantic` below for the provider choice.
  embeddings:
    model: text-embedding-3-small
    dimensions: 1536
    cost_per_1m_input: 0.02
    batch_size: 96

# --- Semantic scoring provider ----------------------------------------------
# Stage 3 wants free semantic scoring. The options, and why the default is what
# it is:
#
#   api     Any configured OpenAI-compatible embeddings API, including OpenAI,
#           Ollama and many hosted providers. The current OpenAI endpoint costs
#           ~$0.29/month for all 45 sources.
#   hash    Free, local, no dependencies: deterministic token-hash vectors. Much
#           weaker semantically, but a real fallback that keeps the pipeline
#           running with no API key and no model download.
# `fallback` is used automatically whenever the primary provider is unavailable
# (no key, network failure, model missing), so a semantic outage degrades stage 3
# to heuristics rather than stopping the run.
semantic:
  provider: api
  fallback: hash
  # Cache vectors by content hash: re-running never re-embeds unchanged text.
  cache: true
