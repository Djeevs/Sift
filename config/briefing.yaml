# ---------------------------------------------------------------------------
# briefing.yaml
#
# The twice-daily briefing: one article containing the ten things worth knowing
# right now, numbered, each a headline, a link and a short summary.
#
# It is a *view over* what Terra already evaluated, not a competitor for it.
# The briefing spends no model budget of its own, creates no Terra demand
# (`terraOpportunity.ts` deliberately ignores it), and does not consume an item
# from the topic feeds: the same article can be both the third line of the
# morning briefing and a full entry in Essential. That overlap is the point —
# the briefing answers "what happened?", the feeds are the reading list.
#
# Turn it off per reader in onboarding
# (`reader_preferences.optional_feeds.briefing`); this file holds the mechanics
# for readers who keep it.
# ---------------------------------------------------------------------------

version: 1
enabled: true

feed:
  id: briefing
  slug: briefing
  title: "Sift · Briefing"
  description: >
    Ten things worth knowing, twice a day, as one short article. Chosen from
    the same evaluations as every other Sift feed, so it stays relevant rather
    than merely recent.
  mode: weighted
  # One digest per slot, not ten entries.
  daily_cap: 1
  # Lower than Essential (0.72) on purpose. Essential answers "was this
  # unambiguously worth 20 minutes?"; the briefing answers "would I regret not
  # knowing this?", which a solid-but-not-exceptional item can clear.
  min_score: 0.50
  categories: []
  weights:
    # Relevance dominates. "Top ten news" without this is a wire service.
    personal_interest: 1.00
    # A briefing is allowed to be timely-and-shallow in a way Essential is not.
    intellectual_depth: 0.35
    novelty: 0.70
    practical_usefulness: 0.55
    expected_attention_value: 0.85
    source_quality: 0.25
    entertainment: 0.15
    critique: 0.10
    delight: 0.15
    # Only -0.20, against -1.10 in Essential and -1.30 in AI × Product.
    #
    # Those feeds penalise "the headline is the whole article" heavily, because
    # they are asking you to open and read the thing. A briefing is not: a major
    # announcement whose headline tells you everything is exactly what belongs
    # on line one. Set to -1.10 here and a measured run dropped every funding
    # round, launch and shutdown — the news — and kept only essays about news.
    headline_sufficiency: -0.20
    ragebait: -2.20
    # Ten lines about one story is the failure mode a digest is most prone to.
    # The cluster rule below is the real defence; this prices it in as well.
    duplicate_information: -1.20
  gates:
    # Stricter than any topic feed. A briefing is read without deliberation, in
    # a batch of ten, which is exactly the condition under which outrage is
    # cheapest to smuggle in.
    max_ragebait: 0.22
    min_expected_attention_value: 0.45

# Editions kept in the rendered feed. Two a day, so this is a month of history.
feed_length: 60

schedule:
  # Local wall-clock times, 24-hour. The briefing is a time-of-day ritual, so
  # these are read in the reader's own timezone rather than UTC.
  times: ["08:00", "20:00"]
  # `local` uses the host clock. An IANA name ("Europe/Amsterdam") pins it, for
  # a Mac that travels or is deliberately set to UTC.
  timezone: local
  # A slot is skipped rather than published this far past its time.
  #
  # The Mac sleeps, so a run frequently discovers a slot hours late. Publishing
  # it anyway is right for a briefing that is 90 minutes old and wrong for one
  # that is nine hours old: an evening briefing delivered at 05:00 is not late
  # news, it is a duplicate of the morning one that is about to arrive. Six
  # hours is half the gap between slots, so at most one slot is ever in flight.
  max_lateness_minutes: 360
  # How often the scheduler looks for a due slot.
  #
  # Separate from the pipeline's own 90-minute cadence on purpose: tying the
  # briefing to it would deliver the 08:00 edition at some point before 09:30,
  # which is not a ritual. The check itself is a single indexed COUNT(*) when
  # nothing is due, so five minutes costs nothing.
  check_interval_minutes: 5

selection:
  # "Top 10", as asked for. Fewer is fine; see min_items.
  items: 10
  # Below this the edition is not published at all.
  #
  # A "top ten" containing two links reads as a broken feed rather than a quiet
  # news day, and it burns the slot: the items would have been better held for
  # the next briefing, which is what skipping does.
  min_items: 4
  # How far back to look for candidates. Slots are twelve hours apart; the extra
  # two hours cover an item that was published just before the last briefing but
  # only finished Terra evaluation after it.
  window_hours: 14
  # Nothing older than this, whatever the window arithmetic says. Guards the
  # first run after a long outage, when the window would otherwise be the only
  # thing standing between the reader and a two-day-old front page.
  max_age_hours: 36
  # One line per story. Clustering already decides what "the same story" means
  # (`src/cluster/signals.ts`), and this is where that pays off most visibly.
  max_per_cluster: 1
  # Three lines from the same publisher is a briefing about that publisher.
  max_per_source: 3
  # Whether an item may appear in a later briefing after appearing in one.
  # False: a briefing is a record of what was new since the last one.
  repeat_across_editions: false

summary:
  # Characters. Long enough to say what happened, short enough that ten of them
  # remain scannable in a reader.
  max_chars: 220
  # Where the short summary comes from, in order, first non-empty wins.
  #
  # `publisher` is the publisher's own words (the RSS summary, or the extracted
  # subtitle). It goes first because a briefing is asked "what happened?", and
  # Sift does not write summaries — the same rule that governs every other feed.
  # `why_it_surfaced` is Terra's one-line reason, already shown to readers in
  # every other feed, and answers "why you" rather than "what happened".
  sources: [publisher, why_it_surfaced]
